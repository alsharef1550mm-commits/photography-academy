/* Layout: right-hand course sidebar + a scrolling studio workspace of module pages (RTL). */
:root{
  --bg:#12151b; --panel:#1a1f28; --panel2:#222936; --line:#2f3847;
  --fg:#e9edf3; --muted:#9aa5b8; --accent:#f2b14b; --accent-ink:#1c1405;
  --teal:#5cc8c0; --good:#6fd08c; --bad:#ff6b6b; --warn:#ff9b5e; --info:#74a8ff;
  --f-head:'Cairo','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal','Cairo',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--f-mono);font-size:.92em;letter-spacing:0}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
.side{width:304px;flex:none;background:var(--panel);border-inline-start:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px 28px;z-index:40}
.main{flex:1;min-width:0}
.page{max-width:1120px;margin:0 auto;padding-block:26px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:none}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand b{font-family:var(--f-head);font-size:17px;line-height:1.25;display:block}
.brand small{color:var(--muted);font-size:12px}
.lvl{font-family:var(--f-head);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin:16px 8px 6px}
.navb{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;padding:9px 10px;border-radius:8px;font-size:14.5px;color:var(--fg)}
.navb:hover{background:var(--panel2)}
.navb[aria-current="page"]{background:var(--panel2);box-shadow:inset -3px 0 0 var(--accent)}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--accent-ink)}
.dot.v{border-color:var(--teal)}
.dot.d{background:var(--good);border-color:var(--good)}
.prog{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));transition:width .4s}

.mhead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.mhead .kick{color:var(--accent);font-family:var(--f-head);font-weight:700;font-size:13px}
.mhead h1{font-size:clamp(24px,4vw,36px);font-weight:900}
.mhead p{color:var(--muted);max-width:68ch;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel.flat{background:var(--panel2)}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.h3{font-size:18px;font-weight:700;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.rule,.mistake,.tip{border-radius:12px;padding:14px 16px;border:1px solid}
.rule{background:rgba(92,200,192,.08);border-color:rgba(92,200,192,.4)}
.mistake{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.4)}
.tip{background:rgba(242,177,75,.08);border-color:rgba(242,177,75,.4)}
.ctitle{font-family:var(--f-head);font-weight:800;font-size:14.5px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.rule .ctitle{color:var(--teal)} .mistake .ctitle{color:var(--bad)} .tip .ctitle{color:var(--accent)}
.rule p,.mistake p,.tip p{font-size:15px}

.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-weight:700;font-size:14.5px}
.val{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:15px;direction:ltr;unicode-bidi:isolate}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;direction:ltr;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-7px;border:3px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button,.chip{background:none;border:0;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:rgba(242,177,75,.15)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 18px;font-weight:700;font-size:15px;font-family:var(--f-head)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.done{background:var(--good)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:9px 14px;font-family:var(--f-head);font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.vf{background:#000;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.vf svg{display:block;width:100%;height:auto}
.hud{position:absolute;inset-inline:0;bottom:0;display:flex;justify-content:space-between;padding:8px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-family:var(--f-mono);font-size:13px;color:#fff;direction:ltr}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;font-family:var(--f-head)}
.b-good{background:rgba(111,208,140,.18);color:var(--good)}
.b-bad{background:rgba(255,107,107,.18);color:var(--bad)}
.b-warn{background:rgba(255,155,94,.18);color:var(--warn)}
.b-info{background:rgba(116,168,255,.18);color:var(--info)}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
table.tb th{background:var(--panel2);text-align:start;padding:8px 10px;font-family:var(--f-head);white-space:nowrap}
table.tb td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.scroll-x{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
ul.bul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:5px;list-style:disc}
ul.bul li{display:list-item}
.opt{display:block;width:100%;text-align:start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:rgba(111,208,140,.12)}
.opt.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
svg text{font-family:var(--f-body)}
.svgbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
.hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(242,177,75,.16),transparent),var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}

  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--panel)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
